name: Deploy to GitHub Pages

on:
  push: { branches: [master] }
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Testes
        run: if [ -f package-lock.json ]; then npm ci && npm test; else echo "Sem testes JS"; fi
      - name: Montar site
        run: ./.github/scripts/build-site.sh _site
      # O site já foi criado em Settings → Pages (fonte: GitHub Actions);
      # sem "enablement" o token não precisa de permissão de admin.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
