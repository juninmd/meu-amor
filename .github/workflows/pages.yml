name: Deploy to GitHub Pages

# Publica no branch gh-pages: o GITHUB_TOKEN consegue escrever nele,
# ao contrário de criar o site via API (que exige admin).
on:
  push: { branches: [master] }
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Testes
        run: if [ -f package-lock.json ]; then npm ci && npm test; else echo "Sem testes JS"; fi
      - name: Montar site
        run: ./.github/scripts/build-site.sh _site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Mantém os previews dos PRs publicados pelo workflow preview.yml.
          clean-exclude: pr-preview/
